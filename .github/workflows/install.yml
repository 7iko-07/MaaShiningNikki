name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "requirements.txt"
      - "tools/ci/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "requirements.txt"
      - "tools/ci/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve MaaFramework release once for all platforms
        id: maafw
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: 'MaaXYZ', repo: 'MaaFramework'
            });
            if (!/^v?\d+\.\d+\.\d+$/.test(data.tag_name)) {
              throw new Error(`Unsupported MaaFramework release: ${data.tag_name}`);
            }
            core.setOutput('tag', data.tag_name);
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if [[ "$is_release" != "true" ]]; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      maafw_tag: ${{ steps.maafw.outputs.tag }}
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  windows:
    needs: meta
    runs-on: ${{ matrix.runner }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download MFAAvalonia
        uses: robinraju/release-downloader@v1
        with:
          repository: 7iko-07/MFAAvalonia
          fileName: "MFAAvalonia-*-win-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}*"
          latest: true
          out-file-path: "install"
          extract: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-${{ matrix.arch }}*"
          tag: ${{ needs.meta.outputs.maafw_tag }}
          out-file-path: "deps"
          extract: true

      - name: Setup Embed Python
        shell: powershell
        run: |
          ./tools/ci/setup_embed_python.ps1 ${{ matrix.arch }}

      - name: Rename MFAAvalonia to MaaShiningNikki
        shell: bash
        run: |
          # 查找 MFAAvalonia.exe 的位置
          exe_path=$(find install -name "MFAAvalonia.exe" | head -n 1)
          
          if [ -z "$exe_path" ]; then
            echo "Warning: MFAAvalonia.exe not found in install directory."
            exit 1
          fi
          
          echo "Found MFAAvalonia.exe at: $exe_path"
          
          # 获取目录路径
          exe_dir=$(dirname "$exe_path")
          
          # 重命名为 MaaShiningNikki.exe
          mv "$exe_path" "$exe_dir/MaaShiningNikki.exe"
          
          if [ $? -eq 0 ]; then
            echo "MFAAvalonia.exe renamed to MaaShiningNikki.exe successfully"
          else
            echo "Failed to rename MFAAvalonia.exe"
            exit 1
          fi

      - name: Modify MaaShiningNikki exe icon
        shell: bash
        run: |
          # 根据架构选择 rcedit 版本
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            rcedit_url="https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          else
            echo "Skipping icon update for Windows ARM64."
            exit 0
          fi

          # 下载 rcedit
          echo "Downloading rcedit for ${{ matrix.arch }}..."
          curl -L "$rcedit_url" -o rcedit.exe

          # 查找 MaaShiningNikki.exe 的位置
          exe_path=$(find install -name "MaaShiningNikki.exe" | head -n 1)

          if [ -z "$exe_path" ]; then
            echo "Warning: MaaShiningNikki.exe not found in install directory."
            exit 0
          fi

          echo "Found MaaShiningNikki.exe at: $exe_path"

          # 修改 exe 图标
          ./rcedit.exe "$exe_path" --set-icon "logo.ico"

          if [ $? -eq 0 ]; then
            echo "MaaShiningNikki icon modified successfully"
          else
            echo "Failed to modify MaaShiningNikki icon"
            exit 1
          fi

      - name: Install
        shell: bash
        run: |
          # 确定平台标签
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            platform_tag="win-x64"
          else
            platform_tag="win-arm64"
          fi
          
          echo "Building for platform: ${platform_tag}"
          
          python -m pip install -r ./tools/requirements.txt

          # 运行安装脚本，传入版本号、系统和架构
          python ./tools/install.py ${{ needs.meta.outputs.tag }} win ${{ matrix.arch }}

          # 清理zip文件
          echo "Cleaning up zip files..."
          find install -name "MFAAvalonia-*.zip" -delete 2>/dev/null || true

      - name: Bundle and verify Python dependencies
        shell: pwsh
        env:
          MAAFW_TAG: ${{ needs.meta.outputs.maafw_tag }}
        run: |
          & ./install/python/python.exe -I tools/ci/bundle_python_dependencies.py --framework-version $env:MAAFW_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./install/python/python.exe -I tools/test_agent_dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platform = if ('${{ matrix.arch }}' -eq 'x86_64') { 'win-x64' } else { 'win-arm64' }
          & ./install/python/python.exe -I tools/ci/check_packaged_agent.py --platform $platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: MaaShiningNikki-win-${{ matrix.arch }}
          path: |
            install
            !install/debug

  unix:
    needs: meta
    runs-on: ${{ matrix.runner }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            runner: ubuntu-24.04
          - os: ubuntu-latest
            arch: aarch64
            runner: ubuntu-24.04-arm
          - os: macos-latest
            arch: x86_64
            runner: macos-15-intel
          - os: macos-latest
            arch: aarch64
            runner: macos-15
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download MFAAvalonia
        uses: robinraju/release-downloader@v1
        with:
          repository: 7iko-07/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'osx' }}-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}*"
          latest: true
          out-file-path: "install"
          extract: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}-${{ matrix.arch }}*"
          tag: ${{ needs.meta.outputs.maafw_tag }}
          out-file-path: "deps"
          extract: true

      - name: Setup Embed Python (Linux / macOS)
        shell: bash
        run: |
          chmod +x ./tools/ci/setup_embed_python.sh
          ./tools/ci/setup_embed_python.sh ${{ matrix.arch }}

      - name: Install
        shell: bash
        run: |
          # 确定平台标签
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            os_name="linux"
          else
            os_name="osx"
          fi
          
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            arch_name="x64"
          else
            arch_name="arm64"
          fi
          
          platform_tag="${os_name}-${arch_name}"
          echo "Building for platform: ${platform_tag}"
          
          python -m pip install -r ./tools/requirements.txt

          # 运行安装脚本，传入版本号、系统和架构
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            install_os="linux"
          else
            install_os="macos"
          fi
          python ./tools/install.py ${{ needs.meta.outputs.tag }} ${install_os} ${{ matrix.arch }}

          # 清理zip文件
          echo "Cleaning up zip files..."
          find install -name "MFAAvalonia-*.zip" -delete 2>/dev/null || true

      - name: Rename MFAAvalonia to MaaShiningNikki
        shell: bash
        run: |
          # Linux 和 macOS 的主程序没有扩展名，只重命名可执行入口，
          # 保留 MFAAvalonia.dll 等运行时依赖的原始名称。
          exe_path=$(find install -type f -name "MFAAvalonia" | head -n 1)

          if [ -z "$exe_path" ]; then
            echo "Warning: MFAAvalonia executable not found in install directory."
            exit 1
          fi

          echo "Found MFAAvalonia executable at: $exe_path"
          exe_dir=$(dirname "$exe_path")
          mv "$exe_path" "$exe_dir/MaaShiningNikki"
          chmod +x "$exe_dir/MaaShiningNikki"
          echo "MFAAvalonia renamed to MaaShiningNikki successfully"

      - name: Bundle and verify Python dependencies
        shell: bash
        env:
          MAAFW_TAG: ${{ needs.meta.outputs.maafw_tag }}
        run: |
          ./install/python/bin/python3 -I tools/ci/bundle_python_dependencies.py --framework-version "$MAAFW_TAG"
          ./install/python/bin/python3 -I tools/test_agent_dependencies.py
          platform="${{ matrix.os == 'ubuntu-latest' && 'linux' || 'osx' }}-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}"
          ./install/python/bin/python3 -I tools/ci/check_packaged_agent.py --platform "$platform"

      # upload-artifact 会丢失执行权限和符号链接；用 tar 保留独立 Python 的结构。
      - name: Preserve Unix executable permissions and symlinks
        shell: bash
        run: tar --exclude='./debug' -cf payload.tar -C install .

      - uses: actions/upload-artifact@v7
        with:
          name: MaaShiningNikki-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}-${{ matrix.arch }}
          path: "payload.tar"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, windows, unix, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets

      - name: Check assets directory
        run: |
          ls -la assets
          if [ -z "$(ls -A assets)" ]; then
            echo "assets directory is empty"
            exit 1
          fi

      - name: Compress and generate checksums
        run: |
          cd assets
          echo "Generating checksums for all zip files..."
          checksum_file="checksums.sha256"
          touch "$checksum_file"

          for f in *; do
            if [ -d "$f" ]; then
              echo "Processing directory: $f"
              zip_file="$f-${{ needs.meta.outputs.tag }}.zip"
              if [ -f "$f/payload.tar" ]; then
                tar -xpf "$f/payload.tar" -C "$f"
                rm "$f/payload.tar"
              fi
              (cd "$f" && zip -ry "../$zip_file" .)
              if [ $? -eq 0 ]; then
                echo "ZIP file created: ../$zip_file"
                echo "Processing directory: $f"
                sha256sum "$zip_file" >> "$checksum_file"
                echo "" >> "$checksum_file"
              else
                echo "Failed to create ZIP file: ../$zip_file"
                exit 1
              fi
            else
              echo "Skipping non-directory: $f"
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.zip
            assets/checksums.sha256
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
